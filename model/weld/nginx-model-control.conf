worker_processes 1;
pid /tmp/nginx-model-control.pid;
error_log /dev/stderr info;

events { worker_connections 128; }

http {
  access_log /dev/stdout;

  # The application listens on loopback only (see entrypoint.sh), so every
  # request must pass through one of the two servers below.  This is what makes
  # mTLS a boundary rather than an optional parallel channel.
  upstream inference_app { server 127.0.0.1:8001; }

  # Public inference port. The internal control plane is not reachable here.
  server {
    listen 8000;

    location /internal/ {
      return 404;
    }

    location / {
      proxy_pass http://inference_app;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # Never let a client inject the header that proves mTLS.
      proxy_set_header X-Model-Control-Channel "";
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
      # Model bundles are the whole point of this endpoint and a detection
      # checkpoint is routinely over 1GB, so the cap must track
      # MODEL_INSTALL_MAX_BYTES rather than a default web-form size.
      client_max_body_size 8g;
      # Stream the upload straight through instead of spooling several GB to
      # disk inside the container first.
      proxy_request_buffering off;
    }
  }

  # Model-agent control port. Client certificates are mandatory.
  server {
    listen 9443 ssl;
    ssl_certificate /opt/model-mtls/inference.crt;
    ssl_certificate_key /opt/model-mtls/inference.key;
    ssl_client_certificate /opt/model-mtls/ca.crt;
    ssl_verify_client on;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
      if ($ssl_client_verify != SUCCESS) { return 403; }
      proxy_pass http://inference_app;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Model-Control-Channel "mtls";
      proxy_set_header X-Model-Control-Client $ssl_client_s_dn;
      # Preparing and draining a revision set can take several minutes.
      proxy_read_timeout 1800s;
      proxy_send_timeout 1800s;
    }
  }
}
