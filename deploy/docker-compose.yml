services:
  # ================================
  # 基础设施服务
  # ================================

  # PostgreSQL 数据库
  postgres:
    image: postgres:14.12-alpine
    container_name: ai-detection-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ai_detection
      POSTGRES_USER: aiuser
      POSTGRES_PASSWORD: aipass123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init_database.sql:/docker-entrypoint-initdb.d/init_database.sql:ro
    networks:
      - ai-services
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U aiuser -d ai_detection" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # MinIO 对象存储（STORAGE_TYPE=minio 时供 api-gateway 使用，与训练平台的 MinIO 相互独立）
  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: ai-detection-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9010:9000"
      - "9011:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minio123456@!}
    volumes:
      - minio_data:/data
    networks:
      - ai-services
    healthcheck:
      test: [ "CMD-SHELL", "sh -c '</dev/tcp/localhost/9000' || exit 1" ]
      interval: 30s
      timeout: 20s
      retries: 3

  # ================================
  # 应用服务
  # ================================

  # API Gateway 后端服务
  api-gateway:
    # 使用本地构建好的镜像
    image: aivision-backend:latest
    container_name: ai-detection-gateway
    restart: unless-stopped
    ports:
      - "9541:8080"
    environment:
      # 数据库连接配置
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/ai_detection
      - SPRING_DATASOURCE_USERNAME=aiuser
      - SPRING_DATASOURCE_PASSWORD=aipass123
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver

      # AI 推理服务配置
      - AI_SERVICES_INFERENCE_URL=http://ai-inference:8000
      - AI_SERVICES_OCR_INFERENCE_URL=http://ai-inference:8000

      # 应用配置
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8080

      # 存储配置：STORAGE_TYPE=local 使用本地文件系统，STORAGE_TYPE=minio 使用本地部署的 MinIO
      # 通过 .env 文件或环境变量覆盖，默认使用本地文件系统
      - STORAGE_TYPE=${STORAGE_TYPE:-local}
      - STORAGE_LOCAL_BASE_DIR=/app/data/files
      - STORAGE_RESULT_DIR=/app/data/results
      # MinIO 配置（STORAGE_TYPE=minio 时生效）
      # MinIO 作为本 compose 内的专属服务部署（见上方 minio 服务），与训练平台的 MinIO 相互独立，
      # 通过 ai-services 网络内的服务名 minio 访问
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-http://minio:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minio123456@!}
      - MINIO_BUCKET=${MINIO_BUCKET:-ai-vision-files}

      # SSO JWT
      - SSO_JWT_ENABLED=${SSO_JWT_ENABLED:-true}
      # 出站方向：签发 token 跳转到训练平台（AIVision-training），共享同一对密钥
      - SSO_JWT_PRIVATE_KEY=${SSO_JWT_PRIVATE_KEY:-}
      - SSO_JWT_ISSUER_SELF=${SSO_JWT_ISSUER_SELF:-external-system}
      - SSO_JWT_TARGET_AUDIENCE=${SSO_JWT_TARGET_AUDIENCE:-aivision-training}
      - SSO_JWT_TRAINING_BASE_URL=${SSO_JWT_TRAINING_BASE_URL:-}

      # JVM优化参数
      - JAVA_OPTS=-Xmx1g -Xms512m -XX:+UseG1GC -XX:+UseContainerSupport
    networks:
      - ai-services
    depends_on:
      postgres:
        condition: service_healthy
      ai-inference:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - files_data:/app/data/files
      - results_data:/app/data/results

  # ================================
  # AI 推理服务 (CPU / GPU 通用)
  # ================================
  model-volume-init:
    image: busybox:1.36
    restart: "no"
    user: "0:0"
    # ai-inference 以 uid 10001 运行，因此它要写的每一个卷都必须归属该用户。
    # store/active/inbox/paddleocr 仅供 ai-inference/model-agent 使用，保持 10001 专属、0770。
    # results/files 是推理任务与预热的输出目录，同时被 api-gateway（uid 999/appuser）读写
    # 结果 JSON 与本地存储文件，两边 uid 不同又不共享 group，因此单独放宽为 0777，
    # 否则 api-gateway 写结果文件会以 AccessDeniedException 失败。
    command: ["sh", "-c", "mkdir -p /store /active /inbox /paddleocr /results /files && chown -R 10001:10001 /store /active /inbox /paddleocr /results /files && chmod 0770 /store /active /inbox /paddleocr && chmod 0777 /results /files"]
    volumes:
      - model_inbox:/inbox
      - model_store:/store
      - model_active:/active
      - paddleocr_cache:/paddleocr
      - results_data:/results
      - files_data:/files

  ai-inference:
    # 镜像通过 .env 文件中的 AI_INFERENCE_IMAGE 变量切换
    # GPU 模式: aivision-ai-inference:latest
    # CPU 模式: aivision-ai-inference-cpu:latest
    image: ${AI_INFERENCE_IMAGE:-aivision-ai-inference:latest}
    container_name: ai-detection-inference
    restart: unless-stopped
    environment:
      - USE_GPU=true
      - BUILD_FLAVOR=${BUILD_FLAVOR:-development}
      - INFERENCE_VERSION=${INFERENCE_VERSION:-0.0.0-dev}
      - MODEL_STORE_ROOT=/app/model/store
      - REVISION_SETS_PATH=/app/model/active/revision_sets.json
      - DEFAULT_RUNTIME_PROFILE=${DEFAULT_RUNTIME_PROFILE:-det-gpu-default}
      - MODEL_AGENT_CONTROL_TOKEN=${MODEL_AGENT_CONTROL_TOKEN:-}
      - MODEL_ADMIN_TOKEN=${MODEL_ADMIN_TOKEN:-}
      - MODEL_INBOX_ROOT=/app/model/inbox
      - MODEL_GPU_SAFETY_MARGIN_MB=${MODEL_GPU_SAFETY_MARGIN_MB:-1024}
      - INFERENCE_TLS_CERT_FILE=/opt/model-mtls/inference.crt
      - INFERENCE_TLS_KEY_FILE=/opt/model-mtls/inference.key
      - INFERENCE_TLS_CA_FILE=/opt/model-mtls/ca.crt
      - PYTHONPATH=/app/model/IQIDDET/src:/app/model/IQIDDET:/app/model
      # 模型权重路径（使用绑定挂载的本地目录）
      - ROI_WEIGHTS=/app/model/weights/weldROI4.pt
      - PRIMARY_WEIGHTS=/app/model/weights/0208primary.pth
      - LOCATION_MODEL=/app/model/weights/location_0.pt
      - LOCATION2_MODEL=/app/model/weights/location_1.pt
      # IQI 像质计模型路径（已通过 COPY weld/ /app/model/ 内置于镜像，使用相对路径）
      - GAUGE_WEIGHTS=IQIDDET/models/guagerotation.pt
      - FCLIP_CKPT=IQIDDET/models/fclip67.pth.tar
      - FCLIP_CONFIG=IQIDDET/models/fclip_config.yaml
      - FCLIP_PARAMS=IQIDDET/params.yaml
      - OCR_REC_MODEL_DIR=IQIDDET/models/OCR_rec_inference_best_accuracy0325
      - OCR_DET_MODEL_DIR=IQIDDET/models/PP-OCRv5_server_det
      - OCR_ORIENTATION_MODEL=IQIDDET/models/ocr_orientation_model.pth
    ports:
      # 宿主机 8100 -> 容器 8000。训练平台后端占用宿主机 8000，两者同机部署时必须错开。
      - "${AI_INFERENCE_PORT:-8100}:8000"
    networks:
      - ai-services
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    volumes:
      - files_data:/app/data/files
      - results_data:/app/data/results
      - ../data/results/ocr_debug:/app/data/results/ocr_debug
      # 模型权重已通过 Dockerfile.pack COPY weight/ /app/model/weights/ 内置于镜像，无需挂载宿主目录
      # PaddleOCR 模型缓存：持久化到 named volume，首次下载后重启不再重新下载
      - paddleocr_cache:/home/model/.paddleocr
      - model_store:/app/model/store:ro
      - model_active:/app/model/active:ro
      # The management API is only an upload/queue entry point: it may write the
      # inbox, never the store or the active state.
      - model_inbox:/app/model/inbox
      - ./model-mtls:/opt/model-mtls:ro
      # 信任列表（只读）：/models 需要回报 trust_list_version，供平台识别现场状态
      - ./model-trust:/opt/model-trust:ro
    depends_on:
      model-volume-init:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  model-agent:
    image: ${MODEL_AGENT_IMAGE:-aivision-model-agent:latest}
    build:
      context: ../model
      dockerfile: weld/Dockerfile.model-agent
    container_name: ai-detection-model-agent
    restart: unless-stopped
    user: "10001:10001"
    environment:
      - BUILD_FLAVOR=${BUILD_FLAVOR:-development}
      # Production must override this to https://ai-inference:9443.
      - INFERENCE_INTERNAL_URL=${INFERENCE_INTERNAL_URL:-http://ai-inference:8000}
      - MODEL_AGENT_CONTROL_TOKEN=${MODEL_AGENT_CONTROL_TOKEN:-}
      - MODEL_AGENT_CA_FILE=/opt/model-mtls/ca.crt
      - MODEL_AGENT_CLIENT_CERT_FILE=/opt/model-mtls/agent.crt
      - MODEL_AGENT_CLIENT_KEY_FILE=/opt/model-mtls/agent.key
    command: ["--inbox", "/app/model/inbox", "--store", "/app/model/store", "--state", "/app/model/active/revision_sets.json", "--trust", "/opt/model-trust/keys.json", "--default-bundles", "/app/model-agent/default-bundles"]
    networks:
      - ai-services
    depends_on:
      model-volume-init:
        condition: service_completed_successfully
      ai-inference:
        condition: service_started
    volumes:
      - model_inbox:/app/model/inbox
      - model_store:/app/model/store
      - model_active:/app/model/active
      - ./model-trust:/opt/model-trust:ro
      - ./model-mtls:/opt/model-mtls:ro

  # 前端服务
  frontend:
    # 使用本地构建好的镜像
    image: aivision-frontend:latest
    container_name: ai-detection-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - ai-services
    depends_on:
      api-gateway:
        condition: service_healthy

# ================================
# 数据卷定义
# ================================
volumes:
  postgres_data:
    driver: local
    name: ai-detection-postgres-data
  files_data:
    driver: local
    name: ai-detection-files-data
  results_data:
    driver: local
    name: ai-detection-results-data
  paddleocr_cache:
    driver: local
    name: ai-detection-paddleocr-cache
  model_inbox:
    driver: local
    name: ai-detection-model-inbox
  model_store:
    driver: local
    name: ai-detection-model-store
  model_active:
    driver: local
    name: ai-detection-model-active
  minio_data:
    driver: local
    name: ai-detection-minio-data

# ================================
# 网络定义
# ================================
networks:
  ai-services:
    name: ai-services
    driver: bridge
