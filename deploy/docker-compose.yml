services:
  # ================================
  # 基础设施服务
  # ================================

  # PostgreSQL 数据库
  postgres:
    image: postgres:14.12-alpine
    container_name: ai-detection-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ai_detection
      POSTGRES_USER: aiuser
      POSTGRES_PASSWORD: aipass123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init_database.sql:/docker-entrypoint-initdb.d/init_database.sql:ro
    networks:
      - ai-services
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U aiuser -d ai_detection" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ================================
  # 应用服务
  # ================================

  # API Gateway 后端服务
  api-gateway:
    build:
      context: ..
      dockerfile: backEnd/api_gateway/Dockerfile
    image: aivision-backend:latest
    container_name: ai-detection-gateway
    restart: unless-stopped
    user: root # Force root user to avoid permission issues with volumes
    ports:
      - "9541:8080"
    environment:
      # 数据库连接配置
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/ai_detection
      - SPRING_DATASOURCE_USERNAME=aiuser
      - SPRING_DATASOURCE_PASSWORD=aipass123
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver

      # AI 推理服务配置 (指向独立的 Python 服务)
      - AI_SERVICES_INFERENCE_URL=http://ai-inference:8000
      # OCR 推理服务配置
      - AI_SERVICES_OCR_INFERENCE_URL=http://ai-inference-ocr:8000

      # 应用配置
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8080

      # JVM优化参数
      - JAVA_OPTS=-Xmx1g -Xms512m -XX:+UseG1GC -XX:+UseContainerSupport
    networks:
      - ai-services
    depends_on:
      postgres:
        condition: service_healthy
      ai-inference:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - files_data:/app/data/files
      - results_data:/app/data/results

  # ================================
  # AI 推理服务 (Python + CUDA)
  # ================================
  ai-inference:
    build:
      context: ../model/weld
      dockerfile: Dockerfile.ai
    image: aivision-ai-inference:latest
    container_name: ai-detection-inference
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=0
      # 模型权重路径（使用绑定挂载的本地目录）
      - ROI_WEIGHTS=/app/model/weights/weldROI4.pt
      - PRIMARY_WEIGHTS=/app/model/weights/primary-weights.pth
    ports:
      - "8000:8000"
    networks:
      - ai-services
    volumes:
      - files_data:/app/data/files
      - results_data:/app/data/results
      # 绑定挂载本地权重目录
      - ../model/weld/weight:/app/model/weights:ro
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # ================================
  # OCR 推理服务 (Python + CUDA + PaddlePaddle)
  # ================================
  ai-inference-ocr:
    build:
      context: ../model/OCR
      dockerfile: Dockerfile.ai
    image: aivision-ai-inference-ocr:latest
    container_name: ai-detection-inference-ocr
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=0
    ports:
      - "8001:8000"
    networks:
      - ai-services
    volumes:
      - files_data:/app/data/files
      - results_data:/app/data/results
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # 前端服务
  frontend:
    build:
      context: ../frontEnd
      dockerfile: Dockerfile
    image: aivision-frontend:latest
    container_name: ai-detection-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - ai-services
    depends_on:
      api-gateway:
        condition: service_healthy

# ================================
# 数据卷定义
# ================================
volumes:
  postgres_data:
    driver: local
    name: ai-detection-postgres-data
  files_data:
    driver: local
    name: ai-detection-files-data
  results_data:
    driver: local
    name: ai-detection-results-data

# ================================
# 网络定义
# ================================
networks:
  ai-services:
    name: ai-services
    driver: bridge
