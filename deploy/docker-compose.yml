services:
  # ================================
  # 基础设施服务
  # ================================
  
  # PostgreSQL 数据库
  postgres:
    image: postgres:14.12-alpine
    container_name: ai-detection-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ai_detection
      POSTGRES_USER: aiuser
      POSTGRES_PASSWORD: aipass123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init_database.sql:/docker-entrypoint-initdb.d/init_database.sql:ro
    networks:
      - ai-services
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiuser -d ai_detection"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Ollama LLM 服务
  ollama:
    image: ollama/ollama:latest
    container_name: ai-detection-ollama
    restart: unless-stopped
    # 避免端口冲突：容器内部依然是 11434，但映射到宿主机改为 11435
    # 后端服务依然通过 http://ollama:11434 访问，不受影响
    ports:
      - "11435:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
    volumes:
      # 挂载宿主机的 ollama 目录 (Mac 下通常是 ~/.ollama)
      - ${HOME}/.ollama:/root/.ollama
    networks:
      - ai-services
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ================================
  # 应用服务
  # ================================
  
  # API Gateway 后端服务
  api-gateway:
    build:
      context: ../backEnd/api_gateway
      dockerfile: Dockerfile
    image: aivision-backend:latest
    container_name: ai-detection-gateway
    restart: unless-stopped
    user: root # Force root user to avoid permission issues with volumes
    ports:
      - "8080:8080"
    environment:
      # 数据库连接配置
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/ai_detection
      - SPRING_DATASOURCE_USERNAME=aiuser
      - SPRING_DATASOURCE_PASSWORD=aipass123
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      
      # Mock AI 服务配置 (代码中已Mock，不会发起真实请求)
      - AI_SERVICES_VISION_AI_URL=http://localhost:8080
      # LLM 服务配置 (使用 Ollama)
      - AI_SERVICES_LLM_AI_URL=http://ollama:11434
      - AI_SERVICES_LLM_AI_MODEL=qwen2:0.5b
      
      # 应用配置
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8080
      
      # JVM优化参数
      - JAVA_OPTS=-Xmx1g -Xms512m -XX:+UseG1GC -XX:+UseContainerSupport
    networks:
      - ai-services
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - files_data:/app/data/files

  # 前端服务
  frontend:
    build:
      context: ../frontEnd
      dockerfile: Dockerfile
    image: aivision-frontend:latest
    container_name: ai-detection-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - ai-services
    depends_on:
      api-gateway:
        condition: service_healthy

# ================================
# 数据卷定义
# ================================
volumes:
  postgres_data:
    driver: local
    name: ai-detection-postgres-data
  ollama_data:
    driver: local
    name: ai-detection-ollama-data
  files_data:
    driver: local
    name: ai-detection-files-data

# ================================
# 网络定义
# ================================
networks:
  ai-services:
    name: ai-services
    driver: bridge
