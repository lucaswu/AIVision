services:
  # ================================
  # 基础设施服务
  # ================================

  # PostgreSQL 数据库
  postgres:
    image: postgres:14.12-alpine
    container_name: ai-detection-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ai_detection
      POSTGRES_USER: aiuser
      POSTGRES_PASSWORD: aipass123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init_database.sql:/docker-entrypoint-initdb.d/init_database.sql:ro
    networks:
      - ai-services
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U aiuser -d ai_detection" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ================================
  # 应用服务
  # ================================

  # API Gateway 后端服务
  api-gateway:
    # 使用本地构建好的镜像
    image: aivision-backend:latest
    container_name: ai-detection-gateway
    restart: unless-stopped
    user: root # Force root user to avoid permission issues with volumes
    ports:
      - "9541:8080"
    environment:
      # 数据库连接配置
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/ai_detection
      - SPRING_DATASOURCE_USERNAME=aiuser
      - SPRING_DATASOURCE_PASSWORD=aipass123
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver

      # AI 推理服务配置
      - AI_SERVICES_INFERENCE_URL=http://ai-inference:8000
      - AI_SERVICES_OCR_INFERENCE_URL=http://ai-inference-ocr:8000

      # 应用配置
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8080

      # 存储配置 (使用本地文件系统)
      - STORAGE_TYPE=local
      - STORAGE_LOCAL_BASE_DIR=/app/data/files
      - STORAGE_RESULT_DIR=/app/data/results

      # JVM优化参数
      - JAVA_OPTS=-Xmx1g -Xms512m -XX:+UseG1GC -XX:+UseContainerSupport
    networks:
      - ai-services
    depends_on:
      postgres:
        condition: service_healthy
      ai-inference:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - files_data:/app/data/files
      - results_data:/app/data/results

  # ================================
  # AI 推理服务 (CPU / GPU 通用)
  # ================================
  ai-inference:
    # 镜像通过 .env 文件中的 AI_INFERENCE_IMAGE 变量切换
    # GPU 模式: aivision-ai-inference:latest
    # CPU 模式: aivision-ai-inference-cpu:latest
    image: ${AI_INFERENCE_IMAGE:-aivision-ai-inference:latest}
    container_name: ai-detection-inference
    restart: unless-stopped
    environment:
      - USE_GPU=true
      # 模型权重路径（使用绑定挂载的本地目录）
      - ROI_WEIGHTS=/app/model/weights/weldROI4.pt
      - PRIMARY_WEIGHTS=/app/model/weights/0208primary.pth
      - LOCATION_MODEL=/app/model/weights/location_0.pt
      - LOCATION2_MODEL=/app/model/weights/location_1.pt
      # IQI 像质计模型路径（已通过 COPY weld/ /app/model/ 内置于镜像，使用相对路径）
      - GAUGE_WEIGHTS=IQIDDET/models/guagerotation.pt
      - FCLIP_CKPT=IQIDDET/models/fclip67.pth.tar
      - FCLIP_CONFIG=IQIDDET/models/fclip_config.yaml
      - OCR_REC_MODEL_DIR=IQIDDET/models/OCR_rec_inference_best_accuracy
      - OCR_DET_MODEL_DIR=IQIDDET/models/PP-OCRv5_server_det
      - OCR_ORIENTATION_MODEL=IQIDDET/models/ocr_orientation_model.pth
    ports:
      - "8000:8000"
    networks:
      - ai-services
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    volumes:
      - files_data:/app/data/files
      - results_data:/app/data/results
      # 绑定挂载本地权重目录
      - ../model/weld/weight:/app/model/weights:ro
      # PaddleOCR 模型缓存：持久化到 named volume，首次下载后重启不再重新下载
      - paddleocr_cache:/root/.paddleocr
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # ================================
  # OCR 推理服务（独立，供前端框选识别使用）
  # ================================
  ai-inference-ocr:
    image: aivision-ai-inference-ocr:latest
    container_name: ai-inference-ocr
    restart: unless-stopped
    environment:
      - USE_GPU=true
    networks:
      - ai-services
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    volumes:
      - paddleocr_cache:/root/.paddleocr
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # 前端服务
  frontend:
    # 使用本地构建好的镜像
    image: aivision-frontend:latest
    container_name: ai-detection-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - ai-services
    depends_on:
      api-gateway:
        condition: service_healthy

# ================================
# 数据卷定义
# ================================
volumes:
  postgres_data:
    driver: local
    name: ai-detection-postgres-data
  files_data:
    driver: local
    name: ai-detection-files-data
  results_data:
    driver: local
    name: ai-detection-results-data
  paddleocr_cache:
    driver: local
    name: ai-detection-paddleocr-cache

# ================================
# 网络定义
# ================================
networks:
  ai-services:
    name: ai-services
    driver: bridge
