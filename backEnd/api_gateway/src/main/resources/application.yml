server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ai-vision-gateway
    
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ai_detection}
    username: ${SPRING_DATASOURCE_USERNAME:aiuser}
    password: ${SPRING_DATASOURCE_PASSWORD:aipass123}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
    
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: ${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
        format_sql: ${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL:false}
        
  servlet:
    multipart:
      # 复用 file-upload.* 的环境变量作为单一事实源：Tomcat 解析阶段的硬限制与下方
      # file-upload 校验、/upload-config 接口返回值保持一致，避免只改一处导致漂移。
      max-file-size: ${FILE_UPLOAD_MAX_FILE_SIZE:200MB}
      max-request-size: ${FILE_UPLOAD_MAX_TOTAL_SIZE:10GB}
      enabled: ${SPRING_SERVLET_MULTIPART_ENABLED:true}

# Local storage configuration (replacing MinIO)
storage:
  type: ${STORAGE_TYPE:local} # local or minio
  local:
    # Use a path within /app to avoid permission issues with non-root user
    base-dir: ${STORAGE_LOCAL_BASE_DIR:/app/data/files}
    result-dir: ${STORAGE_RESULT_DIR:/app/data/results}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin123}
    bucket: ${MINIO_BUCKET:ai-vision-files}
  # 外部可访问路径（传给非容器化的 huodian_ai 服务），可与本地不同
  external-base-dir: ${STORAGE_EXTERNAL_BASE_DIR:/app/data/files}

# AI Services Configuration
ai-services:
  # 推理服务 URL（独立的 Python 容器）
  inference-url: ${AI_SERVICES_INFERENCE_URL:http://ai-inference:8000}
  # OCR 推理服务 URL
  ocr-inference-url: ${AI_SERVICES_OCR_INFERENCE_URL:http://ai-inference-ocr:8000}
  # 调用推理服务的 HTTP 超时：连接短超时快速失败，读取大超时不打断耗时较长的正常推理
  http:
    connect-timeout-ms: ${AI_SERVICES_HTTP_CONNECT_TIMEOUT_MS:10000}
    read-timeout-ms: ${AI_SERVICES_HTTP_READ_TIMEOUT_MS:1800000}
  vision-ai:
    # 推理模式配置
    inference-mode: ${AI_SERVICES_INFERENCE_MODE:det}
    device: ${AI_SERVICES_DEVICE:cuda:0}
    engine: ${AI_SERVICES_ENGINE:rfdet}
    # 检测置信度阈值
    det-confidence: ${AI_SERVICES_DET_CONFIDENCE:0.15}
    # 是否启用横切纵拼推理
    det-wide-slice: ${AI_SERVICES_DET_WIDE_SLICE:true}
    # 超时配置（分钟）
    timeout-minutes: ${AI_SERVICES_TIMEOUT_MINUTES:1440}

# Default User Configuration (临时配置，用于未实现认证时的默认用户)
default-user:
  user-id: ${DEFAULT_USER_ID:default-user}
  user-name: ${DEFAULT_USER_NAME:默认用户}

# SSO JWT Configuration
sso:
  jwt:
    enabled: ${SSO_JWT_ENABLED:false}
    public-key: ${SSO_JWT_PUBLIC_KEY:}
    public-key-file: ${SSO_JWT_PUBLIC_KEY_FILE:classpath:sso_public_key.pem}
    issuer: ${SSO_JWT_ISSUER:external-system}
    audience: ${SSO_JWT_AUDIENCE:ai-vision}
    allowed-clock-skew-seconds: ${SSO_JWT_ALLOWED_CLOCK_SKEW_SECONDS:60}
    auto-create-users: ${SSO_JWT_AUTO_CREATE_USERS:true}
    default-role: ${SSO_JWT_DEFAULT_ROLE:INSPECTOR}

# File Upload Configuration
file-upload:
  # 允许的图片类型
  allowed-image-types:
    - jpg
    - jpeg
    - png
    - gif
    - bmp
    - webp
    - tif
    - tiff
    - dcm
    - dicom
    - dic
    - diconde
  # 文件大小限制
  max-file-size: ${FILE_UPLOAD_MAX_FILE_SIZE:200MB}
  max-total-size: ${FILE_UPLOAD_MAX_TOTAL_SIZE:10GB}
  # 前端分批上传建议值：同时受文件数和批次总字节数约束
  batch-max-files: ${FILE_UPLOAD_BATCH_MAX_FILES:10}
  batch-max-size: ${FILE_UPLOAD_BATCH_MAX_SIZE:500MB}
  batch-timeout-base-ms: ${FILE_UPLOAD_BATCH_TIMEOUT_BASE_MS:60000}
  batch-timeout-ms-per-mb: ${FILE_UPLOAD_BATCH_TIMEOUT_MS_PER_MB:1500}
  max-retries: ${FILE_UPLOAD_MAX_RETRIES:1}
  # 本地存储配置（用于非MinIO模式）
  local:
    base-dir: ${STORAGE_LOCAL_BASE_DIR:/app/data/files}

thumbnail:
  worker:
    fixed-delay-ms: ${THUMBNAIL_WORKER_FIXED_DELAY_MS:3000}
    batch-size: ${THUMBNAIL_WORKER_BATCH_SIZE:20}
  # 调用推理服务生成缩略图的 HTTP 超时；避免推理慢/无响应时调度线程无限阻塞
  http:
    connect-timeout-ms: ${THUMBNAIL_HTTP_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${THUMBNAIL_HTTP_READ_TIMEOUT_MS:120000}

# SpringDoc OpenAPI Configuration
springdoc:
  api-docs:
    path: ${SPRINGDOC_API_DOCS_PATH:/v3/api-docs}
  swagger-ui:
    path: ${SPRINGDOC_SWAGGER_UI_PATH:/swagger-ui.html}
    try-it-out-enabled: ${SPRINGDOC_SWAGGER_UI_TRY_IT_OUT_ENABLED:true}
    operations-sorter: ${SPRINGDOC_SWAGGER_UI_OPERATIONS_SORTER:method}
    tags-sorter: ${SPRINGDOC_SWAGGER_UI_TAGS_SORTER:alpha}
    filter: ${SPRINGDOC_SWAGGER_UI_FILTER:true}
  packages-to-scan: ${SPRINGDOC_PACKAGES_TO_SCAN:com.aivision.gateway.controller}

# Spring Boot Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,metrics,prometheus}
  endpoint:
    health:
      show-details: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:always}
      show-components: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_COMPONENTS:always}
  health:
    datasource:
      enabled: ${MANAGEMENT_HEALTH_DATASOURCE_ENABLED:true}
    diskspace:
      enabled: ${MANAGEMENT_HEALTH_DISKSPACE_ENABLED:true}

# Logging Configuration
logging:
  level:
    com.aivision.gateway: ${LOGGING_LEVEL_GATEWAY:INFO}
    org.springframework.web: ${LOGGING_LEVEL_SPRING_WEB:INFO}
    org.hibernate.SQL: ${LOGGING_LEVEL_HIBERNATE_SQL:ERROR}
    root: ${LOGGING_LEVEL_ROOT:INFO}

# Third Party Project Sync Configuration
third-party:
  project-sync:
    enabled: ${THIRD_PARTY_SYNC_ENABLED:true}
    cron: ${THIRD_PARTY_SYNC_CRON:0 0 2 * * ?}
    auth-url: ${THIRD_PARTY_AUTH_URL:https://zjndt.ztpc.com/api/blade-auth/oauth/getToken}
    project-url: ${THIRD_PARTY_PROJECT_URL:https://zjndt.ztpc.com/api/rocan-project/project/queryAllWithDetails}
    basic-auth: ${THIRD_PARTY_BASIC_AUTH:Basic c2FiZXI6c2FiZXJfc2VjcmV0}
    account: ${THIRD_PARTY_ACCOUNT:qualificationOauthUser}
 
