version: '3.8'

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: ai-detection-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    networks:
      - ai-services
    environment:
      # N8N基础配置
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      
      # 工作流数据持久化
      - N8N_USER_FOLDER=/home/node/.n8n
      
      # AI服务配置 (通过容器名访问同网络服务)
      - VISION_AI_URL=http://vision-ai:8001
      - LLM_AI_URL=http://deepseek-llm:11434
      
      # 存储服务配置 (通过容器名访问同网络服务)
      - MINIO_ENDPOINT=ai-detection-minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - MINIO_BUCKET=ai-detection-bucket
      
      # 数据库配置 (通过容器名访问同网络服务)
      - POSTGRES_HOST=ai-detection-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=ai_detection
      - POSTGRES_USER=aiuser
      - POSTGRES_PASSWORD=aipass123
      
      # 通用配置
      - NODE_ENV=development
      - WEBHOOK_URL=http://localhost:5678
      
    volumes:
      - n8n_data:/home/node/.n8n
      - /var/run/docker.sock:/var/run/docker.sock:ro
    
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  n8n_data:
    driver: local

networks:
  ai-services:
    external: true
    name: ai-services 