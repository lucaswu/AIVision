name: CI/CD Pipeline (Develop)

on:
  push:
    branches: [ develop ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Aliyun Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Backend image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./backEnd/api_gateway/Dockerfile
          push: true
          tags: ${{ secrets.ACR_REGISTRY }}/my_vision/api-gateway:latest

      - name: Build and push Frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./frontEnd
          push: true
          tags: ${{ secrets.ACR_REGISTRY }}/my_vision/frontend:latest

      - name: Proxy pull and push Postgres (To Aliyun)
        run: |
          docker pull postgres:14.12-alpine
          docker tag postgres:14.12-alpine ${{ secrets.ACR_REGISTRY }}/my_vision/postgres:14.12-alpine
          docker push ${{ secrets.ACR_REGISTRY }}/my_vision/postgres:14.12-alpine

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Copy deployment files to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: root
          password: ${{ secrets.ALIYUN_PASSWORD }}
          source: "deploy/docker-compose.prod.yml,deploy/sql/init_database.sql"
          target: "/root/aivision"
          strip_components: 1

      - name: Execute Remote Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: root
          password: ${{ secrets.ALIYUN_PASSWORD }}
          command_timeout: 30m
          script: |
            set -e
            cd /root/aivision
            
            # 1. 更新环境变量文件
            echo "ACR_REGISTRY=${{ secrets.ACR_REGISTRY }}" > .env
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            
            # 2. 登录阿里云仓库
            echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ secrets.ACR_REGISTRY }} --username ${{ secrets.ACR_USERNAME }} --password-stdin
            
            # 3. 拉取最新镜像并重启服务
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            
            # 4. 清理残留
            docker image prune -f
            
            # 5. 打印状态供 CI 日志查看
            echo "Deployment successful! Current containers:"
            docker compose -f docker-compose.prod.yml ps
