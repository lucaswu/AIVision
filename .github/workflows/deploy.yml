name: CI/CD Pipeline (Develop)

on:
  push:
    branches: [ develop ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # 构建阶段使用 GITHUB_TOKEN 即可
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend image
        uses: docker/build-push-action@v4
        with:
          context: ./backEnd/api_gateway
          push: true
          tags: ghcr.io/mzyfree/aivision/api-gateway:latest

      - name: Build and push Frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./frontEnd
          push: true
          tags: ghcr.io/mzyfree/aivision/frontend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Copy deployment files to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: root
          password: ${{ secrets.ALIYUN_PASSWORD }}
          source: "deploy/docker-compose.prod.yml,deploy/sql/init_database.sql"
          target: "/root/aivision"
          strip_components: 1

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: root
          password: ${{ secrets.ALIYUN_PASSWORD }}
          script: |
            cd /root/aivision
            echo "GITHUB_REPOSITORY=mzyfree/aivision" > .env
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            
            # 关键修改：使用您配置的 GH_PAT 登录，以确保有权限拉取私有镜像
            echo ${{ secrets.GH_PAT }} | docker login ghcr.io -u mzyfree --password-stdin
            
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
